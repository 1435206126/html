<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>长图缝合工具 - 增强版</title>
    <style>
        * {
            user-select: none;
        }
        :root {
            --sidebar-width: 85px;
            --bg-color: #121212;
            --accent-color: #ff4757;
            --sidebar-bg: #1e1e1e;
        }

        body {
            margin: 0;
            display: flex;
            height: 100vh;
            background: var(--bg-color);
            color: white;
            font-family: system-ui, 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        /* 左侧边栏 */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 15px;
            z-index: 1000;
            overflow-y: auto;
        }

        .side-btn {
            width: 56px;
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            font-size: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 8px 0;
            transition: all 0.2s ease;
        }
        .side-btn:hover { background: var(--accent-color); border-color: var(--accent-color); transform: scale(1.02);}
        .side-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; background: #2c2c2c;}
        .side-btn span { font-size: 20px; margin-bottom: 4px; }

        /* 颜色区域 */
        .color-section {
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
            border-top: 1px solid #333;
            padding-top: 12px;
        }
        .color-label {
            font-size: 10px;
            color: #aaa;
        }
        #fill-color-picker {
            width: 44px;
            height: 44px;
            border: 2px solid #555;
            border-radius: 50%;
            cursor: pointer;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        #fill-color-picker::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        #fill-color-picker::-webkit-color-swatch {
            border: none;
            border-radius: 50%;
        }
        
        .fill-btns {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            align-items: center;
        }
        .fill-btns .side-btn {
            width: 56px;
            font-size: 9px;
        }

        /* 主舞台 */
        #stage {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #0a0a0a;
            touch-action: none;
            cursor: default;
        }

        /* 大上传占位符 */
        .upload-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            transition: opacity 0.2s;
        }
        .big-upload-btn {
            background: rgba(30,30,40,0.85);
            backdrop-filter: blur(12px);
            border-radius: 64px;
            padding: 208px 408px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            border: 2px dashed var(--accent-color);
            color: white;
            cursor: pointer;
            transition: 0.2s;
            font-size: 60px;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .big-upload-btn:hover {
            background: var(--accent-color);
            border-color: white;
            transform: scale(1.02);
        }
        .big-upload-btn span {
            font-size: 52px;
        }

        #canvas-container {
            position: absolute;
            transform-origin: 0 0;
            display: none;
        }
        canvas {
            display: block;
            background: white;
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
        }

        /* 选区盒子 */
        #selections-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .selection-box {
            position: absolute;
            left: 0;
            right: 0;
            background: rgba(255, 71, 87, 0.4);
            border-top: 2px solid var(--accent-color);
            border-bottom: 2px solid var(--accent-color);
            pointer-events: none;
            box-sizing: border-box;
            box-shadow: inset 0 0 0 1px rgba(255,71,87,0.3);
        }

        .guide-line {
            position: fixed;
            left: var(--sidebar-width);
            right: 0;
            height: 0;
            border-top: 2px dashed var(--accent-color);
            pointer-events: none;
            z-index: 600;
            display: none;
        }

        #file-input {
            display: none;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <button class="side-btn" id="upload-btn-side"><span>📁</span>上传</button>
    <button class="side-btn" id="undo-btn" disabled><span>↩</span>撤销</button>
    <button class="side-btn" id="copy-btn" disabled><span>📋</span>复制</button>
    <button class="side-btn" id="save-btn" disabled><span>💾</span>保存</button>
    
    <!-- 颜色区域 + 两种填充按钮 -->
    <div class="color-section">
        <div class="color-label">填充颜色</div>
        <input type="color" id="fill-color-picker" value="#ffffff">
        <div class="fill-btns">
            <button class="side-btn" id="fill-replace-btn" disabled><span>🎨</span>选区填充</button>
            <button class="side-btn" id="fill-insert-btn" disabled><span>➕</span>插入填充</button>
        </div>
    </div>
</div>

<div id="stage">
    <div class="upload-overlay" id="uploadOverlay">
        <div class="big-upload-btn" id="bigUploadBtn">
            <span>➕</span>
            <div>上传图片</div>
        </div>
    </div>
    <div id="guide-y" class="guide-line"></div>
    <div id="canvas-container">
        <canvas id="mainCanvas"></canvas>
        <div id="selections-wrapper"></div>
    </div>
</div>

<input type="file" id="file-input" accept="image/*">

<script>
    // ---------- DOM 元素 ----------
    const stage = document.getElementById('stage');
    const container = document.getElementById('canvas-container');
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const guideY = document.getElementById('guide-y');
    const selWrapper = document.getElementById('selections-wrapper');
    const undoBtn = document.getElementById('undo-btn');
    const copyBtn = document.getElementById('copy-btn');
    const saveBtn = document.getElementById('save-btn');
    const fillReplaceBtn = document.getElementById('fill-replace-btn');
    const fillInsertBtn = document.getElementById('fill-insert-btn');
    const fillColorPicker = document.getElementById('fill-color-picker');
    const uploadOverlay = document.getElementById('uploadOverlay');
    const bigUploadBtn = document.getElementById('bigUploadBtn');
    const sideUploadBtn = document.getElementById('upload-btn-side');
    const fileInput = document.getElementById('file-input');

    // ---------- 图片状态 ----------
    let img = new Image();
    let hasImage = false;
    let scale = 1.0;
    let translateX = 0, translateY = 0;
    let historyStack = [];
    
    // ---------- 交互标志 ----------
    let isPanning = false;
    let isSelecting = false;
    let startX = 0, startY = 0;
    
    // 选区存储 [{y1, y2}] (canvas原始坐标)
    let selectionRanges = [];
    let currentRange = null;
    let selectStartY = 0;
    
    // 自动滚动
    let scrollSpeed = 0;
    let rafId = null;
    
    // 按键状态
    let spaceDown = false;
    
    // 检查是否应该进入平移模式
    function shouldPan(buttons) {
        const leftPressed = (buttons & 1) !== 0;
        const rightPressed = (buttons & 2) !== 0;
        if (spaceDown && leftPressed) return true;
        if (leftPressed && rightPressed) return true;
        return false;
    }
    
    // ---------- 辅助函数 ----------
    function updateTransform() {
        container.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }
    
    // 渲染选区
    function renderSelectionBoxes() {
        selWrapper.innerHTML = '';
        const allRanges = [...selectionRanges];
        if (currentRange) allRanges.push(currentRange);
        
        allRanges.forEach(range => {
            const div = document.createElement('div');
            div.className = 'selection-box';
            const topPx = range.y1;
            const heightPx = range.y2 - range.y1;
            div.style.top = topPx + 'px';
            div.style.height = heightPx + 'px';
            selWrapper.appendChild(div);
        });
    }
    
    function clearSelections() {
        selectionRanges = [];
        currentRange = null;
        renderSelectionBoxes();
        updateFillButtonsState();
    }
    
    function saveState() {
        if (!hasImage) return;
        const dataURL = canvas.toDataURL();
        historyStack.push(dataURL);
        if (historyStack.length > 30) historyStack.shift();
        undoBtn.disabled = false;
        updateFillButtonsState();
    }
    
    function updateFillButtonsState() {
        const hasSelection = hasImage && selectionRanges.length > 0;
        fillReplaceBtn.disabled = !hasSelection;
        fillInsertBtn.disabled = !hasSelection;
    }
    
    // 合并重叠选区并排序
    function getMergedRanges() {
        if (selectionRanges.length === 0) return [];
        let ranges = [...selectionRanges];
        ranges.sort((a, b) => a.y1 - b.y1);
        const merged = [];
        let last = ranges[0];
        for (let i = 1; i < ranges.length; i++) {
            if (ranges[i].y1 < last.y2) {
                last.y2 = Math.max(last.y2, ranges[i].y2);
            } else {
                merged.push({ ...last });
                last = ranges[i];
            }
        }
        merged.push({ ...last });
        return merged;
    }
    
    // 执行多段裁剪（缝合）
    function performMultiCut() {
        if (!hasImage || selectionRanges.length === 0) return;
        saveState();
        
        const merged = getMergedRanges();
        let totalRemoveHeight = 0;
        merged.forEach(r => totalRemoveHeight += (r.y2 - r.y1));
        const newHeight = canvas.height - totalRemoveHeight;
        if (newHeight <= 0) {
            alert("裁剪后图片高度为零，无效操作");
            return;
        }
        
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvas.width;
        tempCanvas.height = newHeight;
        const tCtx = tempCanvas.getContext('2d');
        
        let destY = 0;
        let lastSrcY = 0;
        merged.forEach(range => {
            const keepHeight = range.y1 - lastSrcY;
            if (keepHeight > 0) {
                tCtx.drawImage(canvas, 0, lastSrcY, canvas.width, keepHeight, 0, destY, canvas.width, keepHeight);
                destY += keepHeight;
            }
            lastSrcY = range.y2;
        });
        if (lastSrcY < canvas.height) {
            const remainHeight = canvas.height - lastSrcY;
            tCtx.drawImage(canvas, 0, lastSrcY, canvas.width, remainHeight, 0, destY, canvas.width, remainHeight);
        }
        
        canvas.width = canvas.width;
        canvas.height = newHeight;
        ctx.drawImage(tempCanvas, 0, 0);
        clearSelections();
        
        // 调整视图位置，让内容保持在视野内
        adjustViewAfterResize();
    }
    
    // 方式1: 选区填充 - 直接替换选区内颜色（不增加空间）
    function fillReplace() {
        if (!hasImage || selectionRanges.length === 0) return;
        saveState();
        
        const merged = getMergedRanges();
        const fillColor = fillColorPicker.value;
        
        // 创建临时canvas来操作
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        const tCtx = tempCanvas.getContext('2d');
        tCtx.drawImage(canvas, 0, 0);
        
        // 对每个选区填充纯色
        merged.forEach(range => {
            tCtx.fillStyle = fillColor;
            tCtx.fillRect(0, range.y1, canvas.width, range.y2 - range.y1);
        });
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(tempCanvas, 0, 0);
        clearSelections();
    }
    
    // 方式2: 插入填充 - 在选区内插入空间并填充颜色（原选区内容向下推移）
    function fillInsert() {
        if (!hasImage || selectionRanges.length === 0) return;
        saveState();
        
        const merged = getMergedRanges();
        const fillColor = fillColorPicker.value;
        
        // 计算新高度 = 原高度 + 所有选区高度之和
        let totalInsertHeight = 0;
        merged.forEach(r => totalInsertHeight += (r.y2 - r.y1));
        const newHeight = canvas.height + totalInsertHeight;
        
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvas.width;
        tempCanvas.height = newHeight;
        const tCtx = tempCanvas.getContext('2d');
        
        let writeY = 0;
        let readY = 0;
        
        // 关键修复：从顶部开始处理，在每个选区的位置插入色块
        for (let i = 0; i < merged.length; i++) {
            const seg = merged[i];
            
            // 1. 拷贝选区之前的内容（从readY到seg.y1）
            const beforeHeight = seg.y1 - readY;
            if (beforeHeight > 0) {
                tCtx.drawImage(canvas, 0, readY, canvas.width, beforeHeight, 0, writeY, canvas.width, beforeHeight);
                writeY += beforeHeight;
            }
            
            // 2. 插入纯色块（高度等于选区高度）- 这就是在选区位置新增的空间
            const insertH = seg.y2 - seg.y1;
            if (insertH > 0) {
                tCtx.fillStyle = fillColor;
                tCtx.fillRect(0, writeY, canvas.width, insertH);
                writeY += insertH;
            }
            
            // 3. 将原选区的内容拷贝到插入色块之后（保持原内容，只是向下推移）
            const segContentHeight = seg.y2 - seg.y1;
            if (segContentHeight > 0) {
                tCtx.drawImage(canvas, 0, seg.y1, canvas.width, segContentHeight, 0, writeY, canvas.width, segContentHeight);
                writeY += segContentHeight;
            }
            
            // 更新读取指针，跳过已处理的选区区域
            readY = seg.y2;
        }
        
        // 拷贝剩余部分
        if (readY < canvas.height) {
            const remainH = canvas.height - readY;
            tCtx.drawImage(canvas, 0, readY, canvas.width, remainH, 0, writeY, canvas.width, remainH);
        }
        
        canvas.width = canvas.width;
        canvas.height = newHeight;
        ctx.drawImage(tempCanvas, 0, 0);
        clearSelections();
        
        // 调整视图位置，让内容保持在视野内
        adjustViewAfterResize();
    }
    
    // 调整视图：当图片高度改变时，适当调整translateY让当前可视区域保持合理
    function adjustViewAfterResize() {
        const stageRect = stage.getBoundingClientRect();
        const canvasHeightInView = canvas.height * scale;
        
        // 如果图片高度小于可视区域，居中显示
        if (canvasHeightInView < stageRect.height) {
            translateY = (stageRect.height - canvasHeightInView) / 2;
        } else {
            // 如果之前视图太靠下或靠上，限制在合理范围内
            const maxTranslateY = 0;
            const minTranslateY = stageRect.height - canvasHeightInView;
            translateY = Math.min(maxTranslateY, Math.max(minTranslateY, translateY));
        }
        updateTransform();
    }
    
    // 加载图片
    function loadImageToCanvas(imageElement) {
        hasImage = true;
        canvas.width = imageElement.width;
        canvas.height = imageElement.height;
        ctx.drawImage(imageElement, 0, 0);
        container.style.display = 'block';
        uploadOverlay.style.display = 'none';
        
        const stageRect = stage.getBoundingClientRect();
        scale = Math.min((stageRect.width - 40) / canvas.width, (stageRect.height - 40) / canvas.height, 1);
        translateX = (stageRect.width - canvas.width * scale) / 2;
        translateY = (stageRect.height - canvas.height * scale) / 2;
        updateTransform();
        
        clearSelections();
        saveBtn.disabled = false;
        copyBtn.disabled = false;
        updateFillButtonsState();
        historyStack = [];
        undoBtn.disabled = true;
    }
    
    function uploadImage(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            img.onload = () => {
                loadImageToCanvas(img);
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    }
    
    function undo() {
        if (historyStack.length === 0) return;
        const data = historyStack.pop();
        const restoreImg = new Image();
        restoreImg.onload = () => {
            canvas.width = restoreImg.width;
            canvas.height = restoreImg.height;
            ctx.drawImage(restoreImg, 0, 0);
            clearSelections();
            if (historyStack.length === 0) undoBtn.disabled = true;
            updateFillButtonsState();
            
            // 恢复视图位置
            const stageRect = stage.getBoundingClientRect();
            scale = Math.min((stageRect.width - 40) / canvas.width, (stageRect.height - 40) / canvas.height, 1);
            translateX = (stageRect.width - canvas.width * scale) / 2;
            translateY = (stageRect.height - canvas.height * scale) / 2;
            updateTransform();
        };
        restoreImg.src = data;
    }
    
    // 自动滚动
    function startAutoScroll() {
        if (scrollSpeed === 0 || !isSelecting) {
            stopAutoScroll();
            return;
        }
        translateY += scrollSpeed;
        updateTransform();
        rafId = requestAnimationFrame(startAutoScroll);
    }
    
    function stopAutoScroll() {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
    }
    
    // 键盘监听
    function handleKeyDown(e) {
        if (e.code === 'Space') {
            spaceDown = true;
            e.preventDefault();
        }
    }
    function handleKeyUp(e) {
        if (e.code === 'Space') {
            spaceDown = false;
            e.preventDefault();
        }
    }
    
    // 鼠标事件
    function onMouseDown(e) {
        if (!hasImage) return;
        e.preventDefault();
        
        const buttons = e.buttons;
        
        // 平移模式
        if (shouldPan(buttons)) {
            isPanning = true;
            isSelecting = false;
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
            return;
        }
        
        // 左键选区模式
        if (e.button === 0 && !spaceDown && !((buttons & 1) && (buttons & 2))) {
            isSelecting = true;
            isPanning = false;
            
            if (!e.shiftKey) {
                clearSelections();
            }
            
            const rect = canvas.getBoundingClientRect();
            let canvasY = (e.clientY - rect.top) / scale;
            canvasY = Math.min(Math.max(canvasY, 0), canvas.height);
            selectStartY = canvasY;
            currentRange = { y1: selectStartY, y2: selectStartY };
            guideY.style.display = 'none';
            renderSelectionBoxes();
        }
    }
    
    function onMouseMove(e) {
        if (!hasImage) return;
        
        if (!isSelecting && !isPanning) {
            guideY.style.display = 'block';
            guideY.style.top = e.clientY + 'px';
        } else {
            guideY.style.display = 'none';
        }
        
        if (isPanning) {
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            updateTransform();
            return;
        }
        
        if (isSelecting) {
            const threshold = 55;
            const viewH = window.innerHeight;
            if (e.clientY > viewH - threshold) {
                scrollSpeed = -14;
            } else if (e.clientY < threshold) {
                scrollSpeed = 14;
            } else {
                scrollSpeed = 0;
            }
            if (scrollSpeed !== 0 && !rafId) startAutoScroll();
            else if (scrollSpeed === 0 && rafId) stopAutoScroll();
            
            const rect = canvas.getBoundingClientRect();
            let currentY = (e.clientY - rect.top) / scale;
            currentY = Math.min(Math.max(currentY, 0), canvas.height);
            if (currentRange) {
                currentRange.y1 = Math.min(selectStartY, currentY);
                currentRange.y2 = Math.max(selectStartY, currentY);
                renderSelectionBoxes();
            }
        }
    }
    
    function onMouseUp(e) {
        if (isSelecting && currentRange) {
            const finalRange = { ...currentRange };
            if (Math.abs(finalRange.y2 - finalRange.y1) > 1.5) {
                selectionRanges.push(finalRange);
                updateFillButtonsState();
            }
            currentRange = null;
            renderSelectionBoxes();
        }
        
        isPanning = false;
        isSelecting = false;
        scrollSpeed = 0;
        stopAutoScroll();
    }
    
    // 右键裁剪
    function onContextMenu(e) {
        e.preventDefault();
        e.stopPropagation();
        if (hasImage && selectionRanges.length > 0) {
            performMultiCut();
        }
        return false;
    }
    
    // 滚轮缩放
    function onWheel(e) {
        if (!hasImage) return;
        e.preventDefault();
        const delta = e.deltaY > 0 ? 0.9 : 1.1;
        const oldScale = scale;
        const newScale = Math.min(Math.max(0.1, scale * delta), 12);
        if (newScale === scale) return;
        const rect = stage.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        const oldWorldX = (mouseX - translateX) / scale;
        const oldWorldY = (mouseY - translateY) / scale;
        scale = newScale;
        translateX = mouseX - oldWorldX * scale;
        translateY = mouseY - oldWorldY * scale;
        updateTransform();
    }
    
    // 全局阻止右键菜单
    function disableGlobalContextMenu(e) {
        if (e.target.closest('#stage') || e.target.closest('.sidebar')) {
            e.preventDefault();
            return false;
        }
    }
    
    function bindEvents() {
        stage.addEventListener('mousedown', onMouseDown);
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
        stage.addEventListener('contextmenu', onContextMenu);
        stage.addEventListener('wheel', onWheel, { passive: false });
        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);
        document.addEventListener('contextmenu', disableGlobalContextMenu);
    }
    
    // 按钮绑定
    sideUploadBtn.onclick = () => fileInput.click();
    bigUploadBtn.onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
        if (e.target.files.length) uploadImage(e.target.files[0]);
        fileInput.value = '';
    };
    
    undoBtn.onclick = () => undo();
    saveBtn.onclick = () => {
        const a = document.createElement('a');
        a.download = `stitch_${Date.now()}.png`;
        a.href = canvas.toDataURL();
        a.click();
    };
    copyBtn.onclick = () => {
        canvas.toBlob(blob => {
            navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]).then(() => alert("已复制图片"));
        });
    };
    fillReplaceBtn.onclick = () => fillReplace();
    fillInsertBtn.onclick = () => fillInsert();
    
    function init() {
        bindEvents();
        container.style.display = 'none';
        uploadOverlay.style.display = 'flex';
        hasImage = false;
        saveBtn.disabled = true;
        copyBtn.disabled = true;
        fillReplaceBtn.disabled = true;
        fillInsertBtn.disabled = true;
        undoBtn.disabled = true;
    }
    
    init();
</script>
