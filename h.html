<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>长图多段缝合工具</title>
    <style>
        :root {
            --sidebar-width: 80px;
            --bg-color: #121212;
            --accent-color: #ff4757;
            --sidebar-bg: #1e1e1e;
        }

        body { margin: 0; display: flex; height: 100vh; background: var(--bg-color); color: white; font-family: sans-serif; overflow: hidden; }

        /* 左侧边栏 */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 20px;
            z-index: 1000;
        }

        .side-btn {
            width: 50px;
            height: 50px;
            background: #333;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
        }
        .side-btn:hover { background: var(--accent-color); border-color: var(--accent-color); }
        .side-btn:disabled { opacity: 0.2; cursor: not-allowed; }
        .side-btn span { font-size: 18px; margin-bottom: 2px; }

        /* 主舞台 */
        #stage {
            flex: 1;
            position: relative;
            overflow: hidden;
            touch-action: none;
        }

        #canvas-container {
            position: absolute;
            transform-origin: 0 0;
            display: none;
        }

        canvas { display: block; background: white; box-shadow: 0 0 30px rgba(0,0,0,0.5); }

        /* 选区与辅助线 */
        .guide-line {
            position: fixed;
            left: var(--sidebar-width);
            right: 0;
            height: 0;
            border-top: 1px dashed var(--accent-color);
            pointer-events: none;
            z-index: 500;
            display: none;
        }

        .selection-box {
            position: absolute;
            left: 0;
            right: 0;
            background: rgba(255, 71, 87, 0.3);
            border-top: 1px solid var(--accent-color);
            border-bottom: 1px solid var(--accent-color);
            pointer-events: none;
        }

        #file-input { display: none; }
    </style>
</head>
<body>

    <div class="sidebar">
        <button class="side-btn" onclick="document.getElementById('file-input').click()"><span>📁</span>上传</button>
        <button class="side-btn" id="undo-btn" disabled><span>↩</span>撤销</button>
        <button class="side-btn" id="copy-btn" disabled><span>📋</span>复制</button>
        <button class="side-btn" id="save-btn" disabled><span>💾</span>保存</button>
        <div style="margin-top:auto; font-size: 10px; color: #666; text-align: center;">Shift<br>多选</div>
    </div>

    <div id="stage">
        <div id="guide-y" class="guide-line"></div>
        <div id="canvas-container">
            <canvas id="mainCanvas"></canvas>
            <!-- 选区容器 -->
            <div id="selections-wrapper"></div>
        </div>
    </div>

    <input type="file" id="file-input" accept="image/*">

    <script>
        const stage = document.getElementById('stage');
        const container = document.getElementById('canvas-container');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const guideY = document.getElementById('guide-y');
        const selWrapper = document.getElementById('selections-wrapper');
        const undoBtn = document.getElementById('undo-btn');
        
        let img = new Image();
        let scale = 1.0, translateX = 0, translateY = 0;
        let history = [];
        let isPanning = false, isSelecting = false;
        let startX, startY;
        
        // 多区域存储: [{y1, y2}, ...]
        let selectionRanges = [];
        let currentRange = null;

        // 自动滚动配置
        let scrollSpeed = 0;
        let rafId = null;

        // --- 1. 图片上传 ---
        document.getElementById('file-input').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                img.onload = () => {
                    history = [];
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    container.style.display = 'block';
                    // 初始缩放居中
                    scale = Math.min((stage.clientWidth - 40) / canvas.width, (stage.clientHeight - 40) / canvas.height, 1);
                    translateX = (stage.clientWidth - canvas.width * scale) / 2;
                    translateY = (stage.clientHeight - canvas.height * scale) / 2;
                    updateTransform();
                    clearSelections();
                    document.getElementById('save-btn').disabled = document.getElementById('copy-btn').disabled = false;
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        };

        // --- 2. 交互逻辑 ---
        
        // 缩放
        stage.addEventListener('wheel', (e) => {
            if (!img.src) return;
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            const oldScale = scale;
            scale = Math.min(Math.max(0.01, scale * delta), 10);
            const rect = stage.getBoundingClientRect();
            translateX = (e.clientX - rect.left) - ((e.clientX - rect.left) - translateX) * (scale / oldScale);
            translateY = (e.clientY - rect.top) - ((e.clientY - rect.top) - translateY) * (scale / oldScale);
            updateTransform();
        }, { passive: false });

        // 鼠标按下
        stage.addEventListener('mousedown', (e) => {
            if (!img.src) return;

            if (e.button === 0) { // 左键
                const isOverCanvas = e.target === canvas || e.target.classList.contains('selection-box');
                if (isOverCanvas && !e.shiftKey) {
                    // 平移模式
                    isPanning = true;
                    startX = e.clientX - translateX;
                    startY = e.clientY - translateY;
                } else {
                    // 选区模式
                    isSelecting = true;
                    if (!e.shiftKey) clearSelections(); // 不按shift则清空旧的
                    
                    const rect = canvas.getBoundingClientRect();
                    startY = (e.clientY - rect.top) / scale;
                    currentRange = { y1: startY, y2: startY };
                    guideY.style.display = 'none'; // 开始选区，辅助线消失
                }
            } else if (e.button === 2) { // 右键直接裁剪
                if (selectionRanges.length > 0) {
                    performMultiCut();
                }
            }
        });

        // 鼠标移动
        window.addEventListener('mousemove', (e) => {
            if (!img.src) return;

            // 辅助线逻辑
            if (!isSelecting && !isPanning) {
                guideY.style.display = 'block';
                guideY.style.top = e.clientY + 'px';
            } else {
                guideY.style.display = 'none';
            }

            if (isPanning) {
                translateX = e.clientX - startX;
                translateY = e.clientY - startY;
                updateTransform();
            } else if (isSelecting) {
                // 边缘自动滚动检查
                const threshold = 50;
                if (e.clientY > window.innerHeight - threshold) {
                    scrollSpeed = -15; // 向下拉，图片往上走
                } else if (e.clientY < threshold) {
                    scrollSpeed = 15;
                } else {
                    scrollSpeed = 0;
                }
                if (scrollSpeed !== 0 && !rafId) startAutoScroll();

                const rect = canvas.getBoundingClientRect();
                let curY = (e.clientY - rect.top) / scale;
                currentRange.y1 = Math.min(startY, curY);
                currentRange.y2 = Math.max(startY, curY);
                renderSelectionBoxes();
            }
        });

        window.addEventListener('mouseup', () => {
            if (isSelecting && currentRange) {
                if (Math.abs(currentRange.y2 - currentRange.y1) > 2) {
                    selectionRanges.push({...currentRange});
                }
            }
            isPanning = false;
            isSelecting = false;
            currentRange = null;
            scrollSpeed = 0;
            stopAutoScroll();
        });

        // 屏蔽系统右键
        window.addEventListener('contextmenu', e => e.preventDefault());

        // --- 3. 核心功能函数 ---

        function updateTransform() {
            container.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        function renderSelectionBoxes() {
            selWrapper.innerHTML = '';
            const allToDraw = [...selectionRanges];
            if (currentRange) allToDraw.push(currentRange);
            
            allToDraw.forEach(range => {
                const div = document.createElement('div');
                div.className = 'selection-box';
                div.style.top = range.y1 + 'px';
                div.style.height = (range.y2 - range.y1) + 'px';
                selWrapper.appendChild(div);
            });
        }

        function clearSelections() {
            selectionRanges = [];
            currentRange = null;
            renderSelectionBoxes();
        }

        // 自动滚动实现
        function startAutoScroll() {
            if (scrollSpeed === 0) {
                stopAutoScroll();
                return;
            }
            translateY += scrollSpeed;
            updateTransform();
            rafId = requestAnimationFrame(startAutoScroll);
        }

        function stopAutoScroll() {
            cancelAnimationFrame(rafId);
            rafId = null;
        }

        // 多区域缝合算法
        function performMultiCut() {
            saveState();
            
            // 1. 合并重叠区域并排序
            selectionRanges.sort((a, b) => a.y1 - b.y1);
            const merged = [];
            if (selectionRanges.length > 0) {
                let last = selectionRanges[0];
                for (let i = 1; i < selectionRanges.length; i++) {
                    if (selectionRanges[i].y1 < last.y2) {
                        last.y2 = Math.max(last.y2, selectionRanges[i].y2);
                    } else {
                        merged.push(last);
                        last = selectionRanges[i];
                    }
                }
                merged.push(last);
            }

            // 2. 计算新高度
            let totalCutHeight = 0;
            merged.forEach(r => totalCutHeight += (r.y2 - r.y1));
            const newHeight = canvas.height - totalCutHeight;
            
            const temp = document.createElement('canvas');
            temp.width = canvas.width;
            temp.height = newHeight;
            const tCtx = temp.getContext('2d');

            // 3. 缝合绘制
            let currentDestY = 0;
            let lastSrcY = 0;

            merged.forEach(range => {
                // 绘制保留的部分（当前选区之前的部分）
                const partHeight = range.y1 - lastSrcY;
                if (partHeight > 0) {
                    tCtx.drawImage(canvas, 0, lastSrcY, canvas.width, partHeight, 0, currentDestY, canvas.width, partHeight);
                    currentDestY += partHeight;
                }
                lastSrcY = range.y2;
            });

            // 绘制最后剩下的部分
            if (lastSrcY < canvas.height) {
                tCtx.drawImage(canvas, 0, lastSrcY, canvas.width, canvas.height - lastSrcY, 0, currentDestY, canvas.width, canvas.height - lastSrcY);
            }

            canvas.height = newHeight;
            ctx.drawImage(temp, 0, 0);
            clearSelections();
        }

        // --- 4. 侧边栏按钮逻辑 ---

        function saveState() {
            history.push(canvas.toDataURL());
            if (history.length > 30) history.shift();
            undoBtn.disabled = false;
        }

        undoBtn.onclick = () => {
            if (history.length === 0) return;
            const data = history.pop();
            const temp = new Image();
            temp.onload = () => {
                canvas.width = temp.width;
                canvas.height = temp.height;
                ctx.drawImage(temp, 0, 0);
                clearSelections();
            };
            temp.src = data;
            if (history.length === 0) undoBtn.disabled = true;
        };

        document.getElementById('save-btn').onclick = () => {
            const a = document.createElement('a');
            a.download = `stitch_${Date.now()}.png`;
            a.href = canvas.toDataURL();
            a.click();
        };

        document.getElementById('copy-btn').onclick = () => {
            canvas.toBlob(blob => {
                const item = new ClipboardItem({ "image/png": blob });
                navigator.clipboard.write([item]).then(() => alert("已复制到剪贴板"));
            });
        };
    </script>
</body>
</html>
